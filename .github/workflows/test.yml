name: Build/test suite

on: push

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-latest
          - os: windows-latest

    name: |
      test ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get install libmpfr-dev libeigen3-dev catch2

      - name: Install MacOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install mpfr catch2 eigen

      - name: CMake configure and build
        uses: threeal/cmake-action@v2.1.0
        with:
          options: |
            XPREC_BUILD_TESTING='ON'
            CMAKE_VERBOSE_MAKEFILE='ON'
          run-build: true

      # XXX this is a hack to allow CMake to find the library
      - name: Move DLL to build directory
        if: startsWith(matrix.os, 'windows')
        run: |
          copy build\\Debug\\xprec.dll build\\test

      - name: Run unit tests
        uses: threeal/ctest-action@v1.1.0
        with:
          verbose: true
